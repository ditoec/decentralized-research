<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="566" viewBox="0 0 1040 566"><rect width="1040" height="566" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b6b6b"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2a62c9"/></marker></defs><rect x="8" y="14" width="1024" height="164" rx="12" fill="#f5f6f8" stroke="#dfe2e7" stroke-width="1"/>
<text x="72" y="102.0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#1b2f5e" text-anchor="middle">Design</text>
<rect x="8" y="200" width="1024" height="164" rx="12" fill="#f5f6f8" stroke="#dfe2e7" stroke-width="1"/>
<text x="72" y="288.0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#1b2f5e" text-anchor="middle">Measurement</text>
<rect x="8" y="386" width="1024" height="164" rx="12" fill="#f5f6f8" stroke="#dfe2e7" stroke-width="1"/>
<text x="72" y="474.0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#1b2f5e" text-anchor="middle">Evaluation</text>
<rect x="140" y="38" width="262" height="116" rx="9" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.1"/>
<text x="154" y="64" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#1b2f5e" text-anchor="start">1. Threat model</text>
<text x="154" y="88" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" font-style="normal" fill="#1f1f1f" text-anchor="start">Requester, provider, verifier</text>
<text x="154" y="108" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" font-style="normal" fill="#1f1f1f" text-anchor="start">Trust assumptions</text>
<text x="154" y="128" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" font-style="normal" fill="#1f1f1f" text-anchor="start">Cost-saving adversary</text>
<rect x="440" y="38" width="262" height="116" rx="9" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.1"/>
<text x="454" y="64" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#1b2f5e" text-anchor="start">2. Protocol design</text>
<text x="454" y="88" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" font-style="normal" fill="#1f1f1f" text-anchor="start">Evidence levels E0, E1, E2-H</text>
<text x="454" y="108" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" font-style="normal" fill="#1f1f1f" text-anchor="start">Seed binding, two-tier check</text>
<text x="454" y="128" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" font-style="normal" fill="#1f1f1f" text-anchor="start">Escrow with provider bond</text>
<rect x="740" y="38" width="262" height="116" rx="9" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.1"/>
<text x="754" y="64" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#1b2f5e" text-anchor="start">3. Analytical model</text>
<text x="754" y="88" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" font-style="normal" fill="#1f1f1f" text-anchor="start">P1: output-only ceiling</text>
<text x="754" y="108" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" font-style="normal" fill="#1f1f1f" text-anchor="start">P2: spot-check detection</text>
<text x="754" y="128" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f1f1f"><tspan>P3: deterrence, best (</tspan><tspan font-style="italic">p</tspan><tspan>, </tspan><tspan font-style="italic">k</tspan><tspan>)</tspan></text>
<rect x="140" y="224" width="262" height="116" rx="9" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.1"/>
<text x="154" y="250" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#1b2f5e" text-anchor="start">4. Testbed and workloads</text>
<text x="154" y="274" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" font-style="normal" fill="#1f1f1f" text-anchor="start">DGX Spark and rented x86</text>
<text x="154" y="294" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" font-style="normal" fill="#1f1f1f" text-anchor="start">GPUs; heterogeneity L0–L4</text>
<text x="154" y="314" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" font-style="normal" fill="#1f1f1f" text-anchor="start">SD1.5 and SDXL in ComfyUI</text>
<rect x="440" y="224" width="262" height="116" rx="9" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.1"/>
<text x="454" y="250" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#1b2f5e" text-anchor="start">5. RQ1: honest variation</text>
<text x="454" y="274" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" font-style="normal" fill="#1f1f1f" text-anchor="start">Deviation of images, latents</text>
<text x="454" y="294" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" font-style="normal" fill="#1f1f1f" text-anchor="start">and single sampler steps,</text>
<text x="454" y="314" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" font-style="normal" fill="#1f1f1f" text-anchor="start">by level and by factor</text>
<rect x="740" y="224" width="262" height="116" rx="9" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.1"/>
<text x="754" y="250" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#1b2f5e" text-anchor="start">6. Calibrate and freeze</text>
<text x="754" y="274" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" font-style="normal" fill="#1f1f1f" text-anchor="start">Tolerances for FPR ≤ 1%</text>
<text x="754" y="294" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" font-style="normal" fill="#1f1f1f" text-anchor="start">on the calibration split;</text>
<text x="754" y="314" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" font-style="normal" fill="#1f1f1f" text-anchor="start">hashed before attack data</text>
<rect x="140" y="410" width="262" height="116" rx="9" fill="#e8effb" stroke="#2a62c9" stroke-width="2"/>
<text x="154" y="436" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#1b2f5e" text-anchor="start">7. RQ2: attack separation</text>
<text x="154" y="460" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" font-style="normal" fill="#1f1f1f" text-anchor="start">Attacks A1–A8, forgeries F1–F4</text>
<text x="154" y="480" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" font-style="normal" fill="#1f1f1f" text-anchor="start">vs deployed rules E0-N, E2-W</text>
<text x="154" y="500" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" font-style="normal" fill="#1f1f1f" text-anchor="start">and E0, E1, E2-H (test split)</text>
<rect x="440" y="410" width="262" height="116" rx="9" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.1"/>
<text x="454" y="436" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#1b2f5e" text-anchor="start">8. RQ3: cost and deterrence</text>
<text x="454" y="460" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" font-style="normal" fill="#1f1f1f" text-anchor="start">Verifier GPU-seconds</text>
<text x="454" y="480" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" font-style="normal" fill="#1f1f1f" text-anchor="start">Solana fees and latency</text>
<text x="454" y="500" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" font-style="normal" fill="#1f1f1f" text-anchor="start">Monte Carlo of P2 and P3</text>
<rect x="740" y="410" width="262" height="116" rx="9" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.1"/>
<text x="754" y="436" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#1b2f5e" text-anchor="start">9. Conclusions</text>
<text x="754" y="460" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" font-style="normal" fill="#1f1f1f" text-anchor="start">Answers to RQ1–RQ3</text>
<text x="754" y="480" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" font-style="normal" fill="#1f1f1f" text-anchor="start">Recommendations for</text>
<text x="754" y="500" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" font-style="normal" fill="#1f1f1f" text-anchor="start">decentralized marketplaces</text>
