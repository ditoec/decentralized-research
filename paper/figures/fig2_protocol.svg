<text x="580" y="227.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#1f1f1f" text-anchor="start">Merkle root of the</text>
<text x="580" y="246.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#1f1f1f" text-anchor="start">trajectory + image</text>
