<svg xmlns="http://www.w3.org/2000/svg" width="1176" height="600" viewBox="0 0 1176 600"><rect width="1176" height="600" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b6b6b"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2a62c9"/></marker></defs><rect x="8" y="12" width="1160" height="142" fill="#ffffff" stroke="#dfe2e7" stroke-width="1"/>
