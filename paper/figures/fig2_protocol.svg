<text x="776" y="203.0" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="bold" font-style="normal" fill="#1b2f5e" text-anchor="start">4. Random draw</text>
<text x="776" y="227.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#1f1f1f" text-anchor="start">Delayed slot hash:</text>
<text x="776" y="246.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#1f1f1f" text-anchor="start">sample? which k steps?</text>
