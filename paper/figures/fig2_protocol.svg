<text x="984" y="193.5" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="bold" font-style="normal" fill="#1b2f5e" text-anchor="start">6. Settle</text>
<text x="984" y="217.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#1f1f1f" text-anchor="start">Pass: pay P, return B</text>
<text x="984" y="236.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#1f1f1f" text-anchor="start">Fail: 2-of-3 review,</text>
<text x="984" y="255.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#1f1f1f" text-anchor="start">refund P, slash B</text>
