<text x="188" y="203.0" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="bold" font-style="normal" fill="#1b2f5e" text-anchor="start">Escrow</text>
<text x="188" y="227.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#1f1f1f" text-anchor="start">Holds P and the</text>
<text x="188" y="246.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#1f1f1f" text-anchor="start">verifier fee</text>
<rect x="370" y="309.5" width="178" height="115" rx="9" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.1"/>
<text x="384" y="335.5" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="bold" font-style="normal" fill="#1b2f5e" text-anchor="start">2. Run and record</text>
<text x="384" y="359.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#1f1f1f" text-anchor="start">Lock bond B, run W,</text>
<text x="384" y="378.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#1f1f1f" text-anchor="start">record trajectory</text>
